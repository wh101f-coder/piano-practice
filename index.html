const $=id=>document.getElementById(id);
const audio=new Audio();
audio.preload='metadata'; audio.preservesPitch=true;
const quarter=60/71, names={C:'도',D:'레',E:'미',F:'파',G:'솔',A:'라',B:'시'}, pitchClass={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const midi=p=>12*(Number(p.at(-1))+1)+pitchClass[p[0]]+Number(p.includes('#'));
const korean=p=>names[p[0]]+p.slice(1).replace('#','♯');
const labels=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const pitch=m=>labels[m%12]+(Math.floor(m/12)-1);
const white=m=>!pitch(m).includes('#');
let data,total,mode=innerWidth<650?1:2,bpm=71,position=0,playing=false,anchorTime=0,anchorBeat=0,frame,rendered='',rowNodes=[],url,decoded,loadId=0,preview=false;
const status=s=>$('status').textContent=s;
const barAt=beat=>data.order[Math.min(data.order.length-1,Math.floor(beat/4))];
const startFor=n=>{
 const repeated=position>=160&&n>=13&&n<=26;
 return (repeated?data.order.lastIndexOf(n):data.order.indexOf(n))*4;
};
function keyboard(){
 const whites=Array.from({length:32},(_,i)=>41+i).filter(white), w=720/whites.length;
 const layer=[[],[]];
 for(let m=41;m<=72;m++){
  const isWhite=white(m),width=isWhite?w:w*.62;
  const x=isWhite?whites.indexOf(m)*w:(whites.indexOf(m-1)+1)*w-width/2;
  layer[isWhite?0:1].push('<rect data-key="'+m+'" x="'+x+'" y="0" width="'+width+'" height="'+(isWhite?95:60)+'" fill="'+(isWhite?'white':'#202936')+'" stroke="#434c58" stroke-width=".8"/>');
 }
 const marks=[48,60,72].map(m=>'<text x="'+((whites.indexOf(m)+.5)*w)+'" y="108" text-anchor="middle" font-size="11">'+korean(pitch(m))+'</text>');

}
function cropScore(svg){
 const inner=svg.querySelector('.definition-scale'), content=inner?.querySelector('.page-margin');
 if(!content)return;
 const raw=content.getBBox(), matrix=content.transform.baseVal.consolidate()?.matrix;
 const pad=85, x=raw.x+(matrix?.e||0)-pad,y=raw.y+(matrix?.f||0)-pad;
 const w=raw.width+2*pad,h=raw.height+2*pad;
 inner.setAttribute('viewBox',[x,y,w,h].join(' '));

function renderPage(n){

 const id=mode+':'+start;

 $('stage').className='mode'+mode; $('stage').replaceChildren();rowNodes=[];
 for(let first=start;first<Math.min(start+mode,43);first+=perRow){
  const last=Math.min(first+perRow-1,42), row=document.createElement('article');
  row.className='system';
  const source=perRow===1?data.singles:perRow===2?data.pairs:data.groups;
  row.innerHTML='<div class="system-head"><span>'+first+(last===first?'':'–'+last)+'마디</span><span class="chord"></span></div><div class="score">'+source[first]+'</div><div class="hands"><div class="hand-labels"><span class="left"></span><span class="right"></span></div><div class="keys">'+keyboard()+'</div></div>';
  $('stage').append(row);

function eventAt(events,beat){

 const l=eventAt(bar.l,beat),r=eventAt(bar.r,beat);
 for(const item of rowNodes){
  const active=n>=item.first&&n<=item.last;
  item.row.classList.toggle('current',active);
  item.measures.forEach((g,i)=>g.classList.toggle('active-measure',item.first+i===n));
  if(!active)continue;
  item.chord.textContent=bar.ch.findLast(c=>c[0]<=beat)[1].replaceAll('#','♯');
  item.left.textContent='왼손 '+(l.p.map(korean).join(' + ')||'쉼');
  item.right.textContent='오른손 '+(r.p.map(korean).join(' + ')||'쉼');
  const lm=l.p.map(midi),rm=r.p.map(midi);
  for(const key of item.keys){
   const m=Number(key.dataset.key),left=lm.includes(m),right=rm.includes(m);
   const base=white(m)?[255,255,255]:[32,41,54];
   const tint=left&&right?[119,60,159]:left?[35,118,206]:[220,55,77];
   const alpha=Math.max(left?l.alpha:0,right?r.alpha:0);
   key.setAttribute('fill','rgb('+base.map((v,i)=>Math.round(v+(tint[i]-v)*alpha)).join(',')+')');
  }
 }
 $('where').textContent=n+'마디 · '+(Math.floor(beat)+1)+'박';
 $('seek').value=position;
 $('play').textContent=playing?'일시정지':'자동재생';
 for(const button of $('measures').children)button.setAttribute('aria-pressed',Number(button.textContent)===n);
}
const cue=()=>Math.max(0,Number($('cue').value)||0);
function clock(){return url&&!preview?(audio.currentTime-cue())/quarter:anchorBeat+(performance.now()-anchorTime)*bpm/60000}
function stop(){
 if(playing)position=Math.min(total-.001,Math.max(0,clock()));
 playing=false;audio.pause();preview=false;cancelAnimationFrame(frame);draw();
}
function tick(){
 if(!playing)return;
 const now=clock();
 if(now>=total-.005||url&&audio.ended){stop();return}
 position=Math.max(0,now);draw();frame=requestAnimationFrame(tick);
}
function jump(to){
 position=Math.min(total-.001,Math.max(0,to));anchorBeat=position;anchorTime=performance.now();
 if(url&&!preview&&Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,cue()+position*quarter);
 draw();
}
async function play(){
 if(playing){stop();return}
 audio.pause();preview=false;
 if(position>=total-.01)position=0;
 if(url){
  if(!Number.isFinite(audio.duration)||cue()+position*quarter>=audio.duration){status('음원 길이와 시작 시각을 확인하세요.');return}
  audio.currentTime=cue()+position*quarter;audio.playbackRate=bpm/71;
  try{await audio.play()}catch(e){status('이 브라우저에서 파일의 소리를 재생할 수 없습니다. MP3·M4A·WAV로 다시 선택해 주세요.');return}
 }
 playing=true;anchorBeat=position;anchorTime=performance.now();tick();
}
function tempo(value){
 if(!Number.isFinite(value))return;
 if(playing)position=Math.min(total-.001,Math.max(0,clock()));
 bpm=Math.max(20,Math.min(240,Math.round(value)));$('tempo').value=bpm;
 anchorBeat=position;anchorTime=performance.now();audio.playbackRate=bpm/71;
}
function loadMedia(blob){
 if(url)URL.revokeObjectURL(url);
 url=URL.createObjectURL(blob);audio.src=url;audio.load();
}
function wav(buffer){
 const channels=Math.min(2,buffer.numberOfChannels), length=buffer.length, bytes=new ArrayBuffer(44+length*channels*2), v=new DataView(bytes);
 const str=(at,s)=>[...s].forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));
 str(0,'RIFF');v.setUint32(4,bytes.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,buffer.sampleRate,true);v.setUint32(28,buffer.sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,bytes.byteLength-44,true);
 const sources=Array.from({length:channels},(_,i)=>buffer.getChannelData(i));
 for(let i=0;i<length;i++)for(let c=0;c<channels;c++)v.setInt16(44+2*(i*channels+c),Math.round(Math.max(-1,Math.min(1,sources[c][i]))*32767),true);
 return new Blob([bytes],{type:'audio/wav'});
}
async function selectFile(file){
 stop();const id=++loadId;decoded=null;$('sync').disabled=true;$('preview').disabled=true;$('useCue').disabled=true;$('cue').value=0;
 if(!file)return;
 status('파일에서 소리를 읽는 중…');
 const Context=window.AudioContext||window.webkitAudioContext;
 let ctx;
 try{
  ctx=new Context();const buffer=await ctx.decodeAudioData(await file.arrayBuffer());
  if(id!==loadId)return;
  decoded=buffer;loadMedia(wav(buffer));$('sync').disabled=false;
  status('소리를 읽었습니다. 시작 위치를 찾는 중…');
  await autoSync(id);
 }catch(e){
  if(id!==loadId)return;
  loadMedia(file);
  status('이 파일의 소리를 직접 재생해 봅니다. 시작 시각은 직접 맞춰 주세요.');
  openCue(true);
 }finally{if(ctx)ctx.close().catch(()=>{})}
}
function openCue(show){$('cuePanel').style.display=show?'flex':'none';$('cuePanel').hidden=!show;$('cueToggle').setAttribute('aria-expanded',show)}
// Compare the intro's written pitches with short spectral windows near the start of the file.
async function autoSync(id){
 if(!decoded)return;
 stop();$('sync').disabled=true;status('첫 마디와 녹화의 소리를 비교하는 중…');
 try{
  const rate=8000, seconds=Math.min(decoded.duration,46), Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const offline=new Offline(1,Math.floor(seconds*rate),rate),source=offline.createBufferSource();
  source.buffer=decoded;source.connect(offline.destination);source.start();
  const samples=(await offline.startRendering()).getChannelData(0);
  if(id!==loadId)return;
  const hop=320, size=1280, notes=Array.from({length:32},(_,i)=>41+i);
  const coeff=notes.map(n=>2*Math.cos(2*Math.PI*440*2**((n-69)/12)/rate));
  const weights=Float32Array.from({length:size},(_,i)=>.5-.5*Math.cos(2*Math.PI*i/(size-1)));
  const features=[];
  for(let at=0;at+size<samples.length;at+=hop){
   const part=weights.map((w,i)=>w*samples[at+i]);
   const energy=coeff.map(c=>{
    let a=0,b=0;
    for(const x of part){const s=x+c*a-b;b=a;a=s}
    return Math.sqrt(Math.max(0,a*a+b*b-c*a*b));
   });
   const norm=Math.hypot(...energy)||1;
   features.push(energy.map(e=>e/norm));
   if(features.length%80===0)await new Promise(r=>setTimeout(r,0));
   if(id!==loadId)return;
  }
  const probes=[];
  for(const bar of data.bars.slice(0,6))for(const event of bar.r){
   if(!event.p.length||event.tie)continue;
   const time=((bar.n-1)*4+event.at+Math.min(.19,event.d*.35))*quarter;
   const left=bar.l.findLast(e=>e.at<=event.at);
   probes.push({offset:Math.round((time-size/(2*rate))*rate/hop),notes:event.p.map(p=>midi(p)-41),bass:left.p.map(p=>midi(p)-41)});
  }
  const scores=[];
  for(let start=0;start+probes.at(-1).offset<features.length;start++){
   let score=0;
   for(const p of probes){
    const f=features[Math.max(0,start+p.offset)];
    score+=p.notes.reduce((sum,n)=>sum+(f[n]||0),0)/p.notes.length+.38*p.bass.reduce((sum,n)=>sum+(f[n]||0),0);
   }
   scores.push({start,score:score/probes.length});
  }
  scores.sort((a,b)=>b.score-a.score);
  const top=scores[0],other=top&&scores.find(s=>Math.abs(s.start-top.start)>Math.round(rate*.42/hop));
  if(top&&top.score>=.23&&(!other||top.score-other.score>=.025)){
   $('cue').value=(top.start*hop/rate).toFixed(2);
   jump(0);status('자동 싱크 후보 '+$('cue').value+'초. 첫 마디를 재생해 확인하세요.');
  }else{
   openCue(true);status('첫 마디 위치를 확실히 찾지 못했습니다. 미리 듣고 시작 시각을 맞춰 주세요.');
  }
 }catch(e){openCue(true);status('자동 싱크를 완료하지 못했습니다. 시작 시각을 직접 맞춰 주세요.')}
 finally{if(id===loadId)$('sync').disabled=false}
}
async function init(){
 const raw=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
 data=JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
 total=data.order.length*4;$('seek').max=total;
 for(const count of [1,2,4,8,16]){
  const b=document.createElement('button');b.textContent=count+'마디';b.setAttribute('aria-pressed',mode===count);
  b.onclick=()=>{mode=count;for(const other of $('modes').children)other.setAttribute('aria-pressed',other===b);draw()};
  $('modes').append(b);
 }
 for(let n=1;n<=42;n++){
  const b=document.createElement('button');b.textContent=n;b.onclick=()=>{jump(startFor(n));$('measureMenu').open=false};$('measures').append(b);
 }
 $('prev').onclick=()=>jump(startFor(Math.max(1,Math.floor((barAt(position)-1)/mode)*mode-mode+1)));
 $('next').onclick=()=>jump(startFor(Math.min(42,Math.floor((barAt(position)-1)/mode)*mode+mode+1)));
 $('play').onclick=play;$('reset').onclick=()=>{stop();jump(0)};$('seek').oninput=()=>jump(Number($('seek').value));
 $('tempo').onchange=()=>tempo($('tempo').valueAsNumber);$('slower').onclick=()=>tempo(bpm-1);$('faster').onclick=()=>tempo(bpm+1);
 $('file').onchange=()=>selectFile($('file').files[0]);$('sync').onclick=()=>autoSync(loadId);
 $('cueToggle').onclick=()=>openCue($('cuePanel').hidden);$('cue').onchange=()=>{stop();jump(0)};
 audio.onloadedmetadata=()=>{$('preview').disabled=false;$('useCue').disabled=false};
 audio.onerror=()=>{status('이 화면녹화 형식을 읽지 못했습니다. MP3·M4A·WAV로 변환한 파일을 선택해 주세요.');$('preview').disabled=true;$('useCue').disabled=true};
 $('preview').onclick=async()=>{
  if(!audio.paused){stop();return}
  stop();preview=true;audio.playbackRate=1;
  try{await audio.play();status('첫 마디가 들리는 곳에서 ‘지금 위치로 맞춤’을 누르세요.')}catch(e){status('음원 미리 듣기를 시작할 수 없습니다.')}
 };
 $('useCue').onclick=()=>{const at=audio.currentTime;stop();$('cue').value=at.toFixed(2);jump(0);status('1마디 시작을 '+$('cue').value+'초로 설정했습니다.')};
 draw();
}
init().catch(()=>status('악보를 열지 못했습니다. 최신 브라우저에서 다시 열어 주세요.'));
</script></body></html>
