  if(c.system){paintSystem(c,currentBar,beat,frac);continue}
  const active=n===currentBar,bb=bars.find(z=>z.n===n),f=active?beat:0;
  const left=bb.lh.find(z=>z[0]<=f&&f<z[0]+z[1]);const rh=bb.rh[f];
  const ro=ended?0:playing?(active?opacity(frac,1):0):1,lo=ended?0:playing?(active?opacity(beat+frac-left[0],left[1]):0):1;
  c.el.classList.toggle('current',active);
  c.lights.forEach(g=>{const on=(g.dataset.hand==='lh'?left[2]:rh).includes(g.dataset.pitch);g.setAttribute('opacity',on?(g.dataset.hand==='lh'?lo:ro):0)});
  c.progress.style.width=(active?(beat+frac)/4*100:n<currentBar?100:0)+'%';
  c.live.textContent=active?symbol([...bb.chords].reverse().find(z=>z[0]<=beat)[1]):'';
  if(!active){c.el.querySelector('.hands .lh').textContent='왼손 '+summary(bb,'lh');c.el.querySelector('.hands .rh').textContent='오른손 '+summary(bb,'rh')}
  if(active){c.el.querySelector('.hands .lh').textContent='왼손 '+names(left[2])+' · '+(beat===left[0]?'누름':'유지');c.el.querySelector('.hands .rh').textContent='오른손 '+names(rh)}
 }
 $('bar').value=currentBar;$('seek').value=ended?total:index+frac;$('position').textContent=`${currentBar}마디 / ${bars.at(-1).n}마디`;
 $('rangeText').textContent=`${bars[pageStart()].n}–${bars[Math.min(bars.length-1,pageStart()+mode-1)].n}마디 · 수록 ${bars.length}마디`;
 $('prevPage').disabled=pageStart()===0;$('nextPage').disabled=pageStart()+mode>=bars.length;
}
const originalBpm=71;
const sourceBeat=60/originalBpm;
const recording=new Audio();
recording.preload='metadata';
recording.preservesPitch=true;
let sourceUrl=null, audioActive=false, activeCue=0, playbackVersion=0;
const cueTime=()=>$('cue').valueAsNumber;
function stopSound(){
 playbackVersion++;
 audioActive=false;
 recording.pause();
}
function playFrom(at){
 stopSound();
 startAt=performance.now()-at*beatMs;
 if(!sourceUrl)return;
 const start=cueTime()+at*sourceBeat;
 if(!Number.isFinite(start)||start<0||start>=recording.duration)return;
 activeCue=cueTime();
 recording.currentTime=start;
 recording.playbackRate=bpm/originalBpm;
 const version=playbackVersion;
 audioActive=true;
 recording.play().catch(()=>{
  if(version!==playbackVersion)return;
  audioActive=false;
  startAt=performance.now()-at*beatMs;
  $('playState').textContent='음원 재생 실패 · 표시만 재생 중';
 });
}
function playbackPosition(){
 if(audioActive)return Math.max(0,(recording.currentTime-activeCue)/sourceBeat);
 return Math.max(0,(performance.now()-startAt)/beatMs);
}
function updateAudioHint(){
 const cue=cueTime();
 $('audioHint').textContent=!sourceUrl?'파일을 고른 뒤 원곡에서 5마디가 시작되는 시각을 입력하세요.'
  :recording.error?'이 음원 파일을 열 수 없습니다.'
  :!Number.isFinite(recording.duration)?'음원 정보를 읽는 중입니다.'
  :!Number.isFinite(cue)?'5마디 시작 시각을 초 단위로 입력하세요.'
  :cue<0||cue>=recording.duration?'음원 길이 안에서 시작 시각을 입력하세요.'
  :cue+total*sourceBeat>recording.duration?'선택한 시각부터 8마디 끝까지 음원이 충분하지 않습니다.'
  :'원곡 연결됨 · 음원 기준 71 BPM';
}
$('recording').onchange=()=>{
 pause();
 if(sourceUrl)URL.revokeObjectURL(sourceUrl);
 const file=$('recording').files[0];
 sourceUrl=file?URL.createObjectURL(file):null;
 if(sourceUrl)recording.src=sourceUrl;else recording.removeAttribute('src');
 $('cue').value='';
 recording.load();
 updateAudioHint();
};
$('cue').oninput=()=>{if(playing)pause();updateAudioHint()};
recording.onloadedmetadata=updateAudioHint;
recording.onerror=updateAudioHint;
recording.onended=()=>{
 if(!audioActive||!playing)return;
 if(playbackPosition()>=total-.03){position=total;ended=true;pause();$('play').textContent='다시 재생';$('playState').textContent='재생 완료';}
 else{pause();$('playState').textContent='음원 끝';}
};
function drawPosition(){
 index=Math.min(total-1,Math.floor(position));
 paint(position-index);
}
function tick(){
 if(!playing)return;
 position=Math.min(total,playbackPosition());
 if(position>=total){
  playing=false;ended=true;stopSound();
  $('play').textContent='다시 재생';$('playState').textContent='재생 완료';
 } 
 drawPosition();
 if(playing)raf=requestAnimationFrame(tick);
}
function pause(){
 if(playing)position=Math.min(total,playbackPosition());
 playing=false;cancelAnimationFrame(raf);stopSound();
 $('play').textContent='자동재생';$('playState').textContent='멈춤';
 drawPosition();
}
function jump(to){
 ended=false;
 position=Math.max(0,Math.min(total-.01,to));
 if(playing)playFrom(position);
 drawPosition();
}
function changeTempo(){
 const value=$('tempo').valueAsNumber;
 if(!Number.isFinite(value)){$('tempo').value=bpm;return}
 const next=Math.max(20,Math.min(240,Math.round(value)));
 $('tempo').value=next;
 if(next===bpm)return;
 if(playing)position=Math.min(total-.01,playbackPosition());
 bpm=next;beatMs=60000/bpm;
 if(playing){
  if(audioActive)recording.playbackRate=bpm/originalBpm;
  else startAt=performance.now()-position*beatMs;
 }
 drawPosition();
}
$('tempo').onchange=changeTempo;
$('tempo').oninput=()=>{const value=$('tempo').valueAsNumber;if(value>=20&&value<=240)changeTempo()};
for(const b of bars){const opt=document.createElement('option');opt.value=b.n;opt.textContent=b.n+'마디로 이동';$('bar').append(opt)}
$('view').onchange=()=>{mode=Number($('view').value);pageKey='';paint()};
$('bar').onchange=()=>jump((Number($('bar').value)-first)*4);
$('prevPage').onclick=()=>jump(Math.max(0,pageStart()-mode)*4);
$('nextPage').onclick=()=>jump(Math.min(bars.length-1,pageStart()+mode)*4);
$('seek').oninput=()=>jump(Number($('seek').value));
$('reset').onclick=()=>{pause();jump(0)};
$('play').onclick=()=>{
 if(playing){pause();return}
 if(ended||position>=total)position=0;
 ended=false;
 if(sourceUrl&&(!Number.isFinite(cueTime())||!Number.isFinite(recording.duration)||cueTime()<0||cueTime()+total*sourceBeat>recording.duration)){
  updateAudioHint();$('playState').textContent='음원 시작 시각 확인';return;
 }
 playing=true;playFrom(position);
 $('play').textContent='일시정지';$('playState').textContent=audioActive?'원곡 재생 중':'표시 재생 중';
 drawPosition();raf=requestAnimationFrame(tick);
};
window.addEventListener('resize',resizeGrid);
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','BUTTON'].includes(e.target.tagName))return;if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight'){e.preventDefault();jump(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();jump(index-1)}});
paint();
</script></body></html>
